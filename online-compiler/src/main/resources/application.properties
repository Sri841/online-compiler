# ============================================================
# Online Compiler — application.properties
# ============================================================

spring.application.name=online-compiler
server.port=8080

# ============================================================
# MySQL — UPDATE THE PASSWORD BELOW
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/compiler_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=SRIJA9932420697
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
# "update" = Hibernate auto-creates the submissions table on first run
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ============================================================
# Compiler Paths — ONLY change these if C/C++ doesn't work
# ============================================================
#
# Windows with MinGW (default install location):
#   compiler.gcc.path=C:/MinGW/bin/gcc.exe
#   compiler.gpp.path=C:/MinGW/bin/g++.exe
#
# Windows with MSYS2:
#   compiler.gcc.path=C:/msys64/mingw64/bin/gcc.exe
#   compiler.gpp.path=C:/msys64/mingw64/bin/g++.exe
#
# Mac / Linux (gcc on PATH — usually works as-is):
#   compiler.gcc.path=gcc
#   compiler.gpp.path=g++
#
compiler.gcc.path=gcc
compiler.gpp.path=g++

# ============================================================
# Logging
# ============================================================
logging.level.com.compiler=DEBUG
